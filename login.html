    <script type="text/javascript">
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                $('#location').removeClass('validationLabel');
                $('#location').removeClass('okLabel');
                $('#location').addClass('validationLabel');
                $('#location').html("Geolocation is not supported by this browser.");
            }
        }

        function showPosition(position) {
            $('#location').removeClass('validationLabel');
            $('#location').removeClass('okLabel');

            var latlondata = position.coords.longitude + "," + position.coords.latitude;
            var latlon = "Your Latitude Position is:=" + position.coords.latitude + "," + "Your Longitude Position is:=" + position.coords.longitude;

            $('#hidLoc').val(latlondata);
            $('#location').html("Ok");
            $('#location').addClass('okLabel');

            //alert(latlon)

            //var img_url = "http://maps.googleapis.com/maps/api/staticmap?center="
            //    + latlondata + "&zoom=14&size=400x300&sensor=false";
            //document.getElementById("mapholder").innerHTML = "<img src='" + img_url + "' />";
        }

        function showError(error) {
            $('#location').removeClass('validationLabel');
            $('#location').removeClass('okLabel');

            if (error.code == 1) {
                $('#location').html("User denied the request for Geolocation.");
                $('#location').addClass('validationLabel');
            } else if (err.code == 2) {
                $('#location').html("Location information is unavailable.");
                $('#location').addClass('validationLabel');
            } else if (err.code == 3) {
                $('#location').html("The request to get user location timed out.");
                $('#location').addClass('validationLabel');
            } else {
                $('#location').html("An unknown error occurred.");
                $('#location').addClass('validationLabel');
            }
        }
    </script>

     <script>
        function generateCaptcha() {
    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let captcha = '';
    for (let i = 0; i < 6; i++) {
        captcha += characters.charAt(Math.floor(Math.random() * characters.length));
    }
    document.getElementById('captcha-code').innerText = captcha;
}

function validateCaptcha() {
    const enteredCaptcha = document.getElementById('captcha').value;
    const generatedCaptcha = document.getElementById('captcha-code').innerText;
    if (enteredCaptcha !== generatedCaptcha) {
        alert('Incorrect captcha, please try again.');
        return false;
    }
    return true;
}

// Generate captcha on page load
window.onload = generateCaptcha;

    </script>
